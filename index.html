<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎧 رادیو محلی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e3a8a 0%, #0f172a 45%, #020617 100%);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* ستاره‌های پس‌زمینه */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 40% 90%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,.5), transparent);
    background-size: 550px 550px;
    opacity: .7;
    pointer-events: none;
    animation: drift 90s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to   { background-position: 550px 550px; }
  }

  .card {
    position: relative;
    width: min(94vw, 460px);
    padding: 36px 30px 30px;
    border-radius: 28px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow:
      0 30px 70px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.08);
    text-align: center;
    z-index: 1;
  }

  .icon {
    width: 76px; height: 76px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    box-shadow: 0 12px 34px rgba(59,130,246,.45);
    transition: transform .4s;
  }
  .icon.live {
    animation: breathe 2s ease-in-out infinite;
    background: linear-gradient(135deg, #ef4444, #f97316);
    box-shadow: 0 12px 34px rgba(239,68,68,.55);
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: .82rem;
    color: #94a3b8;
    margin-bottom: 22px;
  }

  /* ویژوالایزر */
  .visualizer {
    width: 100%;
    height: 90px;
    margin: 14px 0 20px;
    border-radius: 16px;
    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.06);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }

  /* دکمه */
  button {
    width: 100%;
    padding: 15px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 16px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    box-shadow: 0 10px 26px rgba(37,99,235,.45);
    transition: all .2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(37,99,235,.6);
  }
  button:active { transform: translateY(0); }
  button.stop {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 10px 26px rgba(220,38,38,.5);
  }

  /* وضعیت */
  .status {
    margin-top: 18px;
    font-size: .85rem;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 22px;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #64748b;
    transition: background .3s;
  }
  .dot.live {
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: .35; }
  }

  /* شمارنده شنونده */
  .listeners {
    position: absolute;
    top: 16px; left: 20px;
    font-size: .78rem;
    color: #94a3b8;
    background: rgba(0,0,0,.3);
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.07);
  }
</style>
</head>
<body>

<div class="card">
  <div class="listeners" id="listeners">👂 0</div>

  <div class="icon" id="icon">🎧</div>
  <h1>رادیو محلی</h1>
  <div class="subtitle">پخش زنده‌ی صدا در شبکه</div>

  <div class="visualizer">
    <canvas id="canvas"></canvas>
  </div>

  <button id="btn">اتصال به سرور</button>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">قطع</span>
  </div>
</div>

<script>
const SAMPLE_RATE = 16000;

const btn      = document.getElementById('btn');
const dot      = document.getElementById('dot');
const statusEl = document.getElementById('statusText');
const icon     = document.getElementById('icon');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const listenersEl = document.getElementById('listeners');

let ws, audioCtx, workletNode, analyser;
let connected = false;
let rafId;

// ---------- visualizer ----------
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resizeCanvas);

function drawIdle() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(148,163,184,0.25)';
  const bars = 40;
  const bw = w / bars;
  for (let i = 0; i < bars; i++) {
    const bh = 3;
    ctx.fillRect(i * bw + bw * .2, h / 2 - bh / 2, bw * .6, bh);
  }
}

function drawLive() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const bufferSize = analyser.frequencyBinCount;
  const data = new Uint8Array(bufferSize);
  analyser.getByteFrequencyData(data);

  const bars = 48;
  const bw = w / bars;
  const step = Math.floor(bufferSize / bars);

  for (let i = 0; i < bars; i++) {
    let sum = 0;
    for (let j = 0; j < step; j++) sum += data[i * step + j];
    const v = sum / step / 255;
    const bh = Math.max(3, v * h * 0.9);

    const grad = ctx.createLinearGradient(0, h / 2 - bh / 2, 0, h / 2 + bh / 2);
    grad.addColorStop(0, '#60a5fa');
    grad.addColorStop(.5, '#a78bfa');
    grad.addColorStop(1, '#3b82f6');

    ctx.fillStyle = grad;
    const x = i * bw + bw * .18;
    const bwid = bw * .64;
    const y = h / 2 - bh / 2;
    const r = Math.min(bwid / 2, 4);

    ctx.beginPath();
    ctx.roundRect(x, y, bwid, bh, r);
    ctx.fill();
  }

  rafId = requestAnimationFrame(drawLive);
}

// ---------- worklet ----------
const workletCode = `
class PCMPlayer extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Float32Array(0);
    this.pos = 0;
    this.port.onmessage = (e) => {
      const f = e.data;
      const remaining = this.buf.length - this.pos;
      const merged = new Float32Array(remaining + f.length);
      merged.set(this.buf.subarray(this.pos), 0);
      merged.set(f, remaining);
      this.buf = merged;
      this.pos = 0;
    };
  }
  process(_, outputs) {
    const out = outputs[0][0];
    const n = out.length;
    const avail = this.buf.length - this.pos;
    const take = Math.min(n, avail);
    let i = 0;
    for (; i < take; i++) out[i] = this.buf[this.pos + i];
    for (; i < n; i++) out[i] = 0;
    this.pos += take;
    return true;
  }
}
registerProcessor('pcm-player', PCMPlayer);
`;

// ---------- اتصال ----------
async function connect() {
  try {
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(url);

    workletNode = new AudioWorkletNode(audioCtx, 'pcm-player');
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    workletNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'خطا در راه‌اندازی صدا';
    return;
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/listen`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    connected = true;
    btn.textContent = 'قطع اتصال';
    btn.classList.add('stop');
    dot.classList.add('live');
    icon.classList.add('live');
    statusEl.textContent = 'در حال پخش زنده';
    cancelAnimationFrame(rafId);
    drawLive();
  };

  ws.onmessage = (e) => {
    const i16 = new Int16Array(e.data);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    workletNode.port.postMessage(f32, [f32.buffer]);
  };

  ws.onclose = () => disconnect();
  ws.onerror = () => disconnect();
}

function disconnect() {
  connected = false;
  try { ws && ws.close(); } catch {}
  try { audioCtx && audioCtx.close(); } catch {}
  ws = audioCtx = workletNode = analyser = null;

  btn.textContent = 'اتصال به سرور';
  btn.classList.remove('stop');
  dot.classList.remove('live');
  icon.classList.remove('live');
  statusEl.textContent = 'قطع';

  cancelAnimationFrame(rafId);
  drawIdle();
}

btn.onclick = () => connected ? disconnect() : connect();

// ---------- شمارنده شنونده ----------
async function updateListeners() {
  try {
    const r = await fetch('/status');
    const j = await r.json();
    listenersEl.textContent = `👂 ${j.listeners}`;
  } catch {}
}
setInterval(updateListeners, 3000);
updateListeners();

// ---------- شروع ----------
resizeCanvas();
drawIdle();
</script>
</body>
</html>
